name: Build and Release

on: [push, pull_request]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build (Fabric, Quilt)
        run: ./gradlew :fabric:remapJar --no-daemon
      - name: Build (NeoForge)
        run: ./gradlew :neoforge:remapJar --no-daemon
      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v3
        with:
          name: heartfall-fabric
          path: fabric/build/libs/heartfall-*.jar
      - name: Upload NeoForge Artifact
        uses: actions/upload-artifact@v3
        with:
          name: heartfall-neoforge
          path: neoforge/build/libs/heartfall-*.jar